<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Persian RTL for GPTs</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 0;
        padding: 16px;
        min-width: 260px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
        font-weight: 600;
      }
      label {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        font-size: 14px;
      }
      p {
        margin: 12px 0 0;
        font-size: 12px;
        color: #555;
        line-height: 1.45;
      }
      .status {
        margin-top: 10px;
        font-size: 12px;
        color: #0a7;
        font-weight: 500;
      }
      .status.off {
        color: #888;
      }
    </style>
  </head>
  <body>
    <h1>Persian RTL for GPTs</h1>
    <label>
      <input type="checkbox" id="enabled" checked />
      Fix mixed Persian / English text
    </label>
    <p id="status" class="status">Enabled</p>
    <p>
      Works on <strong>chatgpt.com</strong>, <strong>perplexity.ai</strong>, and
      <strong>gemini.google.com</strong>.
      Fixes answers, the prompt box, and research panels. Code blocks stay LTR.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
